# Modified for the Pawly fork, 2026-09-14.
name: Pawly feature request
description: Suggest an improvement to the open-source Pawly interface.
title: "[Pawly feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Which workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
    validations:
      required: true
