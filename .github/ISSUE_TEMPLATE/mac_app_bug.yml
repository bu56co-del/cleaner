# Modified for the Pawly fork, 2026-09-14.
name: Pawly bug report
description: Report a problem with the open-source Pawly app.
title: "[Pawly] "
body:
  - type: markdown
    attributes:
      value: |
        Pawly is an independent open-source interface, not the paid Mole Mac app.
        Remove private paths, passwords and personal files from screenshots or logs.
  - type: input
    id: version
    attributes:
      label: Pawly version and macOS version
      placeholder: "Pawly 1.2, macOS 26.5.2, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or logs with private data removed
